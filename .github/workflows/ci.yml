name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # A tag builds the published APK: it must be signed with the project key.
      - name: Release signing key
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_$name is not set; see docs/release.md"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "QIYAA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "QIYAA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "QIYAA_KEY_ALIAS=$KEY_ALIAS"
            echo "QIYAA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Check and build
        run: |
          VERSION_ARG=""
          [ "$IS_RELEASE" = "true" ] && VERSION_ARG="-PqiyaaVersion=$GITHUB_REF_NAME"
          ./gradlew ktlintCheck testDebugUnitTest lintDebug assembleRelease $VERSION_ARG

      - name: Package
        run: |
          mkdir -p dist
          OUT=app/build/outputs/apk/release
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/"$BUILD_TOOLS"/aapt2)
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APK="dist/QiYaa-$VERSION.apk"
            cp "$OUT/app-release.apk" "$APK"
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            EXPECTED="versionCode='$((MAJOR * 10000 + MINOR * 100 + PATCH))' versionName='$VERSION'"
            "$AAPT2" dump badging "$APK" | head -1 | tee badging.txt
            grep -qF "$EXPECTED" badging.txt || { echo "::error::expected $EXPECTED"; exit 1; }
          else
            cp "$OUT/app-release-unsigned.apk" "dist/QiYaa-0.0.0-dev-${GITHUB_SHA::7}-unsigned.apk"
            "$AAPT2" dump badging dist/*.apk | head -1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: QiYaa-Android
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  # Pushing a tag like v0.2.0 publishes the signed APK as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*.apk
