org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The jam server the app offers until the user sets another (Settings `jam/server`).
# A build can override it: ./gradlew assembleDebug -PqiyaaJamUrl=https://jam.example.org
qiyaaJamUrl=https://qiyaa.kanstancin.net
# Telemetry (docs/telemetry.md) is built in only with -PqiyaaWithTelemetry=true, as CI does for every
# build. It posts to <qiyaaJamUrl>/api/telemetry unless -PqiyaaTelemetryUrl=https://... names another.
